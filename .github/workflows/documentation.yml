name: Publish documentation

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Source ref for a 1.10.0 documentation rebuild
        required: true
        default: main
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name == 'v1.10.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref }}
          path: current

      - name: Check out immutable 1.9.0 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.0
          path: historical-1.9.0

      - name: Check out immutable 1.9.1 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.1
          path: historical-1.9.1

      - name: Check out immutable 1.9.2 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.2
          path: historical-1.9.2

      - name: Check out immutable 1.9.3 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: V1.9.3
          path: historical-1.9.3

      - name: Check out immutable 1.9.4 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.4
          path: historical-1.9.4

      - name: Check out immutable 1.9.5 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.5
          path: historical-1.9.5

      - name: Check out immutable 1.9.6 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.6
          path: historical-1.9.6

      - name: Check out immutable 1.9.7 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.7
          path: historical-1.9.7

      - name: Check out immutable 1.9.8 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.8
          path: historical-1.9.8

      - name: Check out immutable 1.9.9 documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.9.9
          path: historical-1.9.9

      - name: Build preserved and current versioned sites
        run: |
          python3 current/tools/build_docs.py \
            --source historical-1.9.0/docs \
            --versions current/docs/versions.json \
            --release 1.9.0 --output site/1.9.0 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.1/docs \
            --versions current/docs/versions.json \
            --release 1.9.1 --output site/1.9.1 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.2/docs \
            --versions current/docs/versions.json \
            --release 1.9.2 --output site/1.9.2 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.3/docs \
            --versions current/docs/versions.json \
            --release 1.9.3 --output site/1.9.3 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.4/docs \
            --versions current/docs/versions.json \
            --release 1.9.4 --output site/1.9.4 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.5/docs \
            --versions current/docs/versions.json \
            --release 1.9.5 --output site/1.9.5 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.6/docs \
            --versions current/docs/versions.json \
            --release 1.9.6 --output site/1.9.6 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.7/docs \
            --versions current/docs/versions.json \
            --release 1.9.7 --output site/1.9.7 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.8/docs \
            --versions current/docs/versions.json \
            --release 1.9.8 --output site/1.9.8 --site-root site
          python3 current/tools/build_docs.py \
            --source historical-1.9.9/docs \
            --versions current/docs/versions.json \
            --release 1.9.9 --output site/1.9.9 --site-root site
          python3 current/tools/build_docs.py \
            --source current/docs \
            --versions current/docs/versions.json \
            --release 1.10.0 --output site/1.10.0 --site-root site \
            --offline-archive artifacts/mathlib-fp-docs-1.10.0.zip
          python3 -c 'import json; assert json.load(open("site/1.10.0/release.json"))["release"] == "1.10.0"'
          python3 -c 'import json; assert json.load(open("site/1.9.9/release.json"))["release"] == "1.9.9"'
          python3 -c 'import json; assert json.load(open("site/1.9.8/release.json"))["release"] == "1.9.8"'
          python3 -c 'import json; assert json.load(open("site/1.9.7/release.json"))["release"] == "1.9.7"'
          python3 -c 'import json; assert json.load(open("site/1.9.6/release.json"))["release"] == "1.9.6"'
          python3 -c 'import json; assert json.load(open("site/1.9.5/release.json"))["release"] == "1.9.5"'
          python3 -c 'import json; assert json.load(open("site/1.9.4/release.json"))["release"] == "1.9.4"'
          python3 -c 'import json; assert json.load(open("site/1.9.3/release.json"))["release"] == "1.9.3"'
          python3 -c 'import json; assert json.load(open("site/1.9.2/release.json"))["release"] == "1.9.2"'
          python3 -c 'import json; assert json.load(open("site/1.9.1/release.json"))["release"] == "1.9.1"'
          python3 -c 'import json; assert json.load(open("site/1.9.0/release.json"))["release"] == "1.9.0"'
          grep -q 'Current release: 1.10.0' site/index.html
          grep -q '1.9.9/index.html' site/index.html
          grep -q '1.9.8/index.html' site/index.html
          grep -q '1.9.7/index.html' site/index.html
          grep -q '1.9.6/index.html' site/index.html
          grep -q '1.9.5/index.html' site/index.html
          grep -q '1.9.4/index.html' site/index.html
          grep -q '1.9.3/index.html' site/index.html
          grep -q '1.9.2/index.html' site/index.html
          grep -q '1.9.1/index.html' site/index.html
          grep -q '1.9.0/index.html' site/index.html
          python3 current/tools/check_built_docs.py --site site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Publish offline documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mathlib-fp-docs-1.10.0
          if-no-files-found: error
          path: |
            artifacts/mathlib-fp-docs-1.10.0.zip
            artifacts/mathlib-fp-docs-1.10.0.zip.sha256

      - name: Attach offline documentation to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            artifacts/mathlib-fp-docs-1.10.0.zip \
            artifacts/mathlib-fp-docs-1.10.0.zip.sha256 --clobber \
            --repo "$GITHUB_REPOSITORY"

  deploy:
    if: github.event_name != 'release' || github.event.release.tag_name == 'v1.10.0'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
