name: Release qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux-clean-archive:
    if: github.event_name != 'release' || github.event.release.tag_name == 'v1.9.7'
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Install Free Pascal 3.2.2
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl
          test "$(fpc -iV)" = "3.2.2"

      - name: Create and verify clean source archive
        run: |
          mkdir -p "$RUNNER_TEMP/qualification/source"
          git archive --format=tar.gz \
            --output="$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz" \
            > "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz.sha256"
          sha256sum --check \
            "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz.sha256"
          tar -xzf "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz" \
            -C "$RUNNER_TEMP/qualification/source"

      - name: Run Linux qualification offline from extracted archive
        working-directory: ${{ runner.temp }}/qualification/source
        run: |
          cleanup() {
            sudo iptables -D OUTPUT -j MATHLIB_OFFLINE 2>/dev/null || true
            sudo iptables -F MATHLIB_OFFLINE 2>/dev/null || true
            sudo iptables -X MATHLIB_OFFLINE 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo iptables -N MATHLIB_OFFLINE
          sudo iptables -A MATHLIB_OFFLINE -o lo -j RETURN
          sudo iptables -A MATHLIB_OFFLINE \
            -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
          sudo iptables -A MATHLIB_OFFLINE -j REJECT
          sudo iptables -I OUTPUT 1 -j MATHLIB_OFFLINE
          python3 tools/qualify_release.py --release 1.9.7 \
            --compiler fpc --skip-package --network-isolated \
            --source-archive \
              "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz" \
            --source-checksum \
              "$RUNNER_TEMP/qualification/mathlib-fp-1.9.7.tar.gz.sha256"

      - name: Publish Linux qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-1.9.7-linux-x86-64
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qualification/mathlib-fp-1.9.7.tar.gz.sha256
            ${{ runner.temp }}/qualification/source/build-temp/release-qualification

  windows-clean-archive:
    if: github.event_name != 'release' || github.event.release.tag_name == 'v1.9.7'
    runs-on: windows-latest

    steps:
      - name: Check out release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Install Lazarus 4.8 and Free Pascal 3.2.2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP `
            'lazarus-4.8-fpc-3.2.2-win64.exe'
          $url = 'https://download.lazarus-ide.org/' + `
            'Lazarus%20Windows%2064%20bits/Lazarus%204.8/' + `
            'lazarus-4.8-fpc-3.2.2-win64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expected = `
            'ED25EE171D55E23CF14E0633159FDD2325EFBA56E186F8AB817AD3BF97D267D7'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $expected) {
            throw 'Lazarus installer checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'lazarus-win64'
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            '/SP-'
            "/DIR=$root"
          ) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          $fpc = Join-Path $root 'fpc/3.2.2/bin/x86_64-win64/fpc.exe'
          $lazbuild = Join-Path $root 'lazbuild.exe'
          if ((& $fpc '-iV').Trim() -ne '3.2.2') {
            throw 'Expected FPC 3.2.2'
          }
          @(
            "FPC_WIN64=$fpc"
            "LAZBUILD_WIN64=$lazbuild"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and verify clean source archive
        shell: pwsh
        run: |
          $qualification = Join-Path $env:RUNNER_TEMP 'qualification'
          $source = Join-Path $qualification 'source'
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          $archive = Join-Path $qualification 'mathlib-fp-1.9.7.zip'
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  mathlib-fp-1.9.7.zip" | Set-Content `
            -Encoding ascii "$archive.sha256"
          Expand-Archive -LiteralPath $archive -DestinationPath $source

      - name: Run Windows qualification offline from extracted archive
        shell: pwsh
        working-directory: ${{ runner.temp }}/qualification/source
        run: |
          $archive = Join-Path $env:RUNNER_TEMP `
            'qualification/mathlib-fp-1.9.7.zip'
          $checksum = "$archive.sha256"
          $rule = 'mathlib-fp qualification runner connection'
          $runner = Get-Process -Name 'Runner.Worker' -ErrorAction Stop | `
            Select-Object -First 1
          New-NetFirewallRule -DisplayName $rule -Direction Outbound `
            -Action Allow -Program $runner.Path -Profile Any | Out-Null
          $profiles = Get-NetFirewallProfile | Select-Object Name,DefaultOutboundAction
          try {
            Set-NetFirewallProfile -Profile Domain,Public,Private `
              -DefaultOutboundAction Block
            python tools/qualify_release.py --release 1.9.7 `
              --compiler $env:FPC_WIN64 --lazbuild $env:LAZBUILD_WIN64 `
              --network-isolated --source-archive $archive `
              --source-checksum $checksum
            if ($LASTEXITCODE -ne 0) { throw "qualification exited $LASTEXITCODE" }
          }
          finally {
            foreach ($profile in $profiles) {
              Set-NetFirewallProfile -Name $profile.Name `
                -DefaultOutboundAction $profile.DefaultOutboundAction
            }
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }

      - name: Publish Windows qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-1.9.7-windows-x86-64
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qualification/mathlib-fp-1.9.7.zip.sha256
            ${{ runner.temp }}/qualification/source/build-temp/release-qualification
